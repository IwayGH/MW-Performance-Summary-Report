        #sidebar { width: 320px; background-color: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 10; box-shadow: 2px 0 5px rgba(0,0,0,0.05); }
        #sidebar-header { padding: 15px; background-color: #2c3e50; color: white; font-size: 16px; font-weight: bold; text-align: center; }
        #control-panel { padding: 15px; border-bottom: 1px solid #eee; background-color: #fcfcfc; }
        .control-group { margin-bottom: 12px; }
        .control-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .control-group input[type="file"] { font-size: 12px; width: 100%; }
        .control-group input[type="date"] { padding: 5px; width: 48%; border: 1px solid #ccc; border-radius: 4px; }
        .control-group input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 12px; }
        .btn { display: inline-block; padding: 8px 12px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        .btn:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #95a5a6; }
        #menu-container { flex-grow: 1; overflow-y: auto; padding-top: 10px; }
        .region-item { border-bottom: 1px solid #eee; }
        .region-header { padding: 10px 15px; cursor: pointer; font-weight: bold; background-color: #f9f9f9; display: flex; justify-content: space-between; font-size: 13px; }
        .region-header:hover { background-color: #f0f0f0; }
        .region-header .arrow { transition: transform 0.3s; font-size: 10px; }
        .region-header.active .arrow { transform: rotate(90deg); }
        .poi-list { list-style-type: none; padding: 0; margin: 0; display: none; background-color: #fff; }
        .poi-list.show { display: block; }
        .poi-list li { padding: 8px 15px 8px 25px; border-top: 1px solid #f5f5f5; cursor: pointer; font-size: 12px; color: #444; }
        .poi-list li:hover { background-color: #e6f7ff; color: #0056b3; }
        .poi-list li.active { font-weight: bold; color: #d63384; background-color: #fff0f5; border-left: 3px solid #d63384; }
        
        .search-result-item { padding: 10px 15px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .search-result-item:hover { background-color: #e6f7ff; }
        .search-result-title { font-weight: bold; color: #2c3e50; font-size: 13px; }
        .search-result-sub { font-size: 10px; color: #888; margin-top: 2px; }
        .search-info { padding: 10px 15px; font-size: 12px; color: #555; font-weight: bold; border-bottom: 1px solid #eee; background: #fcfcfc; }
        .no-result { padding: 15px; color: #e74c3c; text-align: center; font-size: 12px; }

        #main-content { flex-grow: 1; position: relative; background-color: #fafafa; }
        #mynetwork { width: 100%; height: 100%; }

        #detail-panel {
            position: absolute; top: 0; right: 0; width: 380px;
            height: 100%; background: #fff; padding: 20px; 
            box-shadow: -4px 0 15px rgba(0,0,0,0.1); border-left: 1px solid #ddd; z-index: 20;
            box-sizing: border-box;
            transform: translateX(100%); transition: transform 0.3s ease-in-out;
            overflow-y: auto;
        }
        #detail-panel.active { transform: translateX(0); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; font-weight: bold; color: #aaa; cursor: pointer; z-index: 21; }
        .close-btn:hover { color: #333; }
        #detail-panel h3 { margin-top: 0; color: #333; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; font-size: 16px; margin-bottom: 15px; }

        .summary-box { margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 4px; border-left: 4px solid #2c3e50; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
        .summary-row:last-child { margin-bottom: 0; }
        .summary-label { font-weight: bold; color: #555; }
        .summary-value { font-family: monospace; color: #000; font-weight: bold; text-align: right; }

        .chart-box { margin-bottom: 20px; border-top: 1px solid #eee; padding-top: 15px; }
        .chart-title { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .chart-value { font-family: monospace; color: #2c3e50; }
        
        #legend { background: #fff; padding: 12px 15px; border-top: 1px solid #eee; font-size: 12px; flex-shrink: 0; }
        .legend-title { font-size: 12px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        .legend-item { margin-bottom: 5px; display: flex; align-items: center; }
        .color-box { width: 15px; height: 15px; margin-right: 8px; border-radius: 3px; border: 1px solid #999; }

        #equip-image-container { margin-bottom: 15px; text-align: center; background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px solid #e0e0e0; }
        #equip-image-container .equip-label { font-size: 11px; font-weight: bold; color: #2c3e50; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
        #equip-image-container img { max-width: 100%; height: auto; border-radius: 4px; border: 1px solid #ddd; max-height: 200px; object-fit: contain; background: #fff; padding: 4px; }

        #copyright-bar { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(44,62,80,0); color: #000; text-align: center; font-size: 11px; padding: 5px 0; letter-spacing: 0.5px; z-index: 15; pointer-events: none; }
        #copyright-bar span { color: #000; font-weight: bold; }

        /* --- CSS untuk Dashboard MW --- */
        #dashboard-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #f4f6f9; z-index: 5; overflow-y: auto; display: none;
        }
        #dash-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: #fff; border-bottom: 1px solid #ddd;
            position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        #dash-header h2 { margin: 0; font-size: 18px; color: #2c3e50; }
        #dash-controls { display: flex; gap: 10px; align-items: center; font-size: 12px; }
        #dash-controls input[type="date"] { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        #dash-controls button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: #fff; font-size: 12px; }
        #dash-apply-btn { background: #3498db; }
        #dash-close-btn { background: #e74c3c; }
        #week-info { font-weight: bold; color: #2c3e50; background: #eef2f7; padding: 6px 12px; border-radius: 12px; }

        #dashboard-content {
            padding: 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px;
        }
        .dash-card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee; }
        .dash-card h3 { margin-top: 0; font-size: 14px; color: #2c3e50; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-bottom: 15px; }
        .dash-stat-row { display: flex; justify-content: space-around; margin-bottom: 20px; text-align: center; }
        .dash-stat-item .val { font-size: 28px; font-weight: bold; color: #3498db; }
        .dash-stat-item .lbl { font-size: 12px; color: #666; text-transform: uppercase; margin-top: 5px; }
        .dash-chart-container { height: 250px; position: relative; }
        
        #fetch-status { font-size: 11px; padding: 8px; margin-top: 5px; text-align: center; border-radius: 4px; background: #f8f9fa; font-weight: bold; }
    </style>
</head>

<div id="wrapper">

        <div id="control-panel">
            <div class="control-group">
                <label>1. Upload Data Performa (.xlsx)</label>

            </div>

            <div class="control-group" style="margin-top: 15px;">

            <div id="fetch-status"></div>

        <div id="menu-container"></div>
        <div id="legend">

        </div>
    </div>

    <div id="copyright-bar">📡 Developed by <span>Imam Wahyudi (TS MW)</span> | MW Performance Summary | © 2026</div>

    <div id="main-content">

            <div id="summary-container"></div>

        </div>
        
        <div id="dashboard-overlay">
            <div id="dash-header">

                <div id="dash-controls">

                    <input type="date" id="dashStartDate">

                    <input type="date" id="dashEndDate">

                </div>
            </div>
            <div id="dashboard-content"></div>
        </div>
    </div>
</div>

        if (!graph[id1]) graph[id1] = [];
        if (!graph[id2]) graph[id2] = [];
        graph[id1].push(id2);
        graph[id2].push(id1);
        if (!regionMap[region]) regionMap[region] = new Set();
        regionMap[region].add(poi);
        if (!nodeData[id1]) nodeData[id1] = { id: id1, region: region };
        if (!nodeData[id2]) nodeData[id2] = { id: id2, region: region };
        if (!poiToNodes[poi]) poiToNodes[poi] = new Set();
        poiToNodes[poi].add(id1);
        poiToNodes[poi].add(id2);
        nodeToPoi[id1] = poi;
        nodeToPoi[id2] = poi;
    });

    function downloadTemplate() {
        const headers = [["Link_ID", "Date", "RSL_dBm", "Capacity_Mbps", "Availability_%", "Total_Downlink", "Bandwidth", "Modulation", "Configuration", "Capacity Design"]];
        const ws = XLSX.utils.aoa_to_sheet(headers);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Performance Data");
        XLSX.writeFile(wb, "NMS_Template_Upload.xlsx");
    }

    function cleanParseFloat(val) {
        if (val === null || val === undefined || val === '#N/A' || val === '#VALUE!') return NaN;
        if (typeof val === 'string' && val.indexOf('%') !== -1) {
            val = val.replace('%', '');
            return parseFloat(val);
        }
        return parseFloat(val);
    }

    function normalizeLinkId(id) {
        if (!id) return null;
        id = String(id).replace('(IB)', '').trim();
        return id.replace(/-\d+$/, '');
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 }); 
                const headers = jsonData[0];
                const rows = jsonData.slice(1);
                let tempData = {};
                let foundCount = 0;
                const linkIdx = headers.findIndex(h => String(h).toLowerCase().includes('link'));
                const dateIdx = headers.findIndex(h => String(h).toLowerCase().includes('date'));
                const rslIdx = headers.findIndex(h => String(h).toLowerCase() === 'rsl_dbm' || (String(h).toLowerCase().includes('rsl') && String(h).toLowerCase().includes('dbm')));
                const capIdx = headers.findIndex(h => String(h).toLowerCase().includes('cap') && !String(h).toLowerCase().includes('design'));
                const availIdx = headers.findIndex(h => String(h).toLowerCase().includes('avail'));
                const utilIdx = headers.findIndex(h => String(h).toLowerCase().includes('utilization') || String(h).toLowerCase().includes('util'));
                let downlinkIdx = headers.findIndex(h => String(h).toLowerCase().includes('downlink') || String(h).toLowerCase().includes('total'));
                const bwIdx = headers.findIndex(h => String(h).toLowerCase().includes('bandwidth'));
                const modIdx = headers.findIndex(h => String(h).toLowerCase().includes('modulation'));
                const confIdx = headers.findIndex(h => String(h).toLowerCase().includes('configuration'));
                const rslDesignIdx = headers.findIndex(h => String(h).toLowerCase().includes('design') && String(h).toLowerCase().includes('rsl'));
                const capDesignIdx = headers.findIndex(h => String(h).toLowerCase().includes('capacity') && String(h).toLowerCase().includes('design'));
                if(rslIdx === -1) alert("Kolom 'RSL_dBm' tidak ditemukan!");
                rows.forEach(row => {
                    let rawLinkId = linkIdx !== -1 ? String(row[linkIdx]).trim() : null;
                    let linkId = normalizeLinkId(rawLinkId);
                    if (!linkId || !linkId.includes('-')) {
                         if(rawLinkId && rawLinkId.includes('-')) linkId = rawLinkId; 
                    }
                    if (linkId && linkId.includes('-')) {
                        if (!tempData[linkId]) tempData[linkId] = [];
                        let dateVal = dateIdx !== -1 ? row[dateIdx] : null;
                        if (typeof dateVal === 'number') {
                             const utc_days = Math.floor(dateVal - 25569);
                             const utc_value = utc_days * 86400;
                             dateVal = new Date(utc_value * 1000).toISOString().split('T')[0];
                        } else {
                            dateVal = String(dateVal);
                        }
                        let rslVal = cleanParseFloat(row[rslIdx]);
                        let capVal = cleanParseFloat(row[capIdx]);
                        let availVal = cleanParseFloat(row[availIdx]);
                        let utilVal = utilIdx !== -1 ? cleanParseFloat(row[utilIdx]) : NaN;
                        let downlinkVal = cleanParseFloat(row[downlinkIdx]); 
                        let bwVal = bwIdx !== -1 ? row[bwIdx] : null;
                        let modVal = modIdx !== -1 ? row[modIdx] : null;
                        let confVal = confIdx !== -1 ? row[confIdx] : null;
                        let rslDesignVal = cleanParseFloat(row[rslDesignIdx]);
                        let capDesignVal = cleanParseFloat(row[capDesignIdx]);
                        if(String(bwVal).includes('#N/A') || String(bwVal).includes('#VALUE!')) bwVal = 'N/A';
                        if(String(modVal).includes('#N/A') || String(modVal).includes('#VALUE!')) modVal = 'N/A';
                        if(String(confVal).includes('#N/A') || String(confVal).includes('#VALUE!')) confVal = 'N/A';
                        if (!isNaN(availVal) && availVal <= 1 && availVal >= 0) availVal = availVal * 100;
                        if (!isNaN(utilVal) && utilVal <= 1 && utilVal >= 0) utilVal = utilVal * 100;
                        tempData[linkId].push({
                            date: dateVal, rsl: rslVal, cap: capVal, avail: availVal, util: utilVal,
                            downlink: downlinkVal, bandwidth: bwVal ? String(bwVal) : 'N/A',
                            modulation: modVal ? String(modVal) : 'N/A',
                            configuration: confVal ? String(confVal) : 'N/A',
                            rslDesign: rslDesignVal, capDesign: capDesignVal
                        });
                        foundCount++;
                    }
                });
                performanceData = tempData;
                const statusEl = document.getElementById('fetch-status');
                if(statusEl) statusEl.innerHTML = '✅ Data Excel berhasil dimuat: ' + Object.keys(performanceData).length + ' links';
                applyFilters();
            } catch (err) {
                alert('Gagal membaca file. Pastikan format sesuai template Excel.');
                console.error('XLSX Parse Error:', err);
                const statusEl = document.getElementById('fetch-status');
                if(statusEl) statusEl.innerHTML = '⚠️ <span style="color:red;">Format Excel tidak valid</span>';
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // ---------------------------------------------------------
    // 5. VISUALISASI TOPOLOGY
    // ---------------------------------------------------------
    const container = document.getElementById('mynetwork');

    function loadTopology(rootPoi, currentRegion, focusNode = null) {
        const visited = new Set();
        const queue = [rootPoi];
        visited.add(rootPoi);
        let i = 0;
        while (i < queue.length) {
            const curr = queue[i++];
            if (graph[curr]) {
                graph[curr].forEach(n => {
                    if (!visited.has(n)) {
                        visited.add(n);
                        queue.push(n);
                    }
                });
            }
        }
        const levels = {};
        const q = [{id: rootPoi, level: 0}];
        levels[rootPoi] = 0;
        let j = 0;
        while(j < q.length) {
            const {id, level} = q[j++];
            if (graph[id]) {
                graph[id].forEach(neighbor => {
                    if (visited.has(neighbor) && levels[neighbor] === undefined) {
                        levels[neighbor] = level + 1;
                        q.push({id: neighbor, level: level + 1});
                    }
                });
            }
        }
        const nodes = [];
        const edges = [];
        const getMetricStyle = (linkId) => {
            const linkPerf = performanceData[linkId];
            if (linkPerf) {
                const start = document.getElementById('startDate').value;
                const end = document.getElementById('endDate').value;
                const filtered = linkPerf.filter(d => {
                    if (!d.date) return false;
                    const dDate = new Date(d.date);
                    const sDate = start ? new Date(start) : new Date('1970-01-01');
                    const eDate = end ? new Date(end) : new Date();
                    return dDate >= sDate && dDate <= eDate;
                });
                if (filtered.length > 0) {
                    const validRsl = filtered.filter(d => !isNaN(d.rsl)).map(d => d.rsl);
                    if (validRsl.length > 0) {
                        const maxRsl = Math.max(...validRsl); 
                        let color = '#95a5a6';
                        if (maxRsl >= -3) { color = '#27ae60'; }
                        else if (maxRsl >= -6) { color = '#00bcd4'; }
                        else if (maxRsl >= -9) { color = '#f1c40f'; }
                        else if (maxRsl >= -10) { color = '#e74c3c'; }
                        return { color, width: 2, hasData: true, maxRsl };
                    }
                }
            }
            return { color: '#aaa', width: 1.5, hasData: false };
        };
        visited.forEach(id => {
            const isMaster = (id === rootPoi);
            const lvl = levels[id] || 0;
            nodes.push({
                id: id, label: id, level: lvl,
                shape: 'box', 
                color: { background: isMaster ? '#ecf0f1' : '#fff', border: isMaster ? '#2c3e50' : '#34495e' },
                font: { color: '#2c3e50', size: 12 }, borderWidth: 2, shadow: true, margin: isMaster ? 10 : 15,
                title: `Node: ${id}`
            });
        });
        visited.forEach(id => {
            if (graph[id]) {
                graph[id].forEach(neighbor => {
                    if (visited.has(neighbor) && id < neighbor) {
                        const linkId1 = `${id}-${neighbor}`;
                        const linkId2 = `${neighbor}-${id}`;
                        let style = getMetricStyle(linkId1);
                        if (!style.hasData) style = getMetricStyle(linkId2);
                        let ipAddress = linkToIp[linkId1] || linkToIp[linkId2] || 'N/A';
                        edges.push({
                            from: id, to: neighbor,
                            dashes: false, 
                            color: { color: style.color },
                            width: style.width,
                            smooth: { type: 'continuous' },
                            title: `Link: ${linkId1} | ${ipAddress}\nMax RSL: ${style.maxRsl ? style.maxRsl.toFixed(2) : 'N/A'} dBm`,
                            id: linkId1
                        });
                    }
                });
            }
        });
        const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
            layout: { hierarchical: { enabled: true, direction: 'LR', sortMethod: 'directed', levelSeparation: 200, nodeSpacing: 150 } },
            interaction: { dragNodes: true, zoomView: true, dragView: true, navigationButtons: true, keyboard: true },
            physics: { enabled: false }, nodes: { borderWidth: 2 }
        };
        if (network) network.destroy();
        network = new vis.Network(container, data, options);
        if (focusNode) {
            network.once("afterDrawing", () => {
                if (network.findNode(focusNode).length > 0) {
                    network.focus(focusNode, { scale: 1.5, animation: { duration: 1000, easingFunction: "easeInOutQuad" } });
                    network.selectNodes([focusNode]);
                    showNodeDetails(focusNode);
                }
            });
        }
        network.on("click", function (params) {
            if (params.nodes.length > 0) showNodeDetails(params.nodes[0]);
            else if (params.edges.length > 0) showLinkDetails(params.edges[0]);
            else closeDetailPanel();
        });
    }

            const modVal = staticInfoRec ? staticInfoRec.modulation : 'N/A';

        }
    }

// LOGIKA DASHBOARD MW

let currentDashPaket = 'Main';
let currentDashRegions = [];
let dashCharts = [];

function getWeekNumber(d) {
    d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
    var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
    var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
    return weekNo;
}

function showDashboard(paket, regions = []) {
    currentDashPaket = paket;
    currentDashRegions = regions;
    
    document.getElementById('mynetwork').style.display = 'none';
    document.getElementById('detail-panel').classList.remove('active');
    document.getElementById('dashboard-overlay').style.display = 'block';
    
    const dashContent = document.getElementById('dashboard-content');
    dashContent.innerHTML = '';
    destroyDashCharts();
    
    const startVal = document.getElementById('dashStartDate').value;
    const endVal = document.getElementById('dashEndDate').value;
    
    const sDate = startVal ? new Date(startVal) : new Date(Date.now() - 6 * 24 * 60 * 60 * 1000);
    const eDate = endVal ? new Date(endVal) : new Date();
    
    document.getElementById('dashStartDate').value = sDate.toISOString().split('T')[0];
    document.getElementById('dashEndDate').value = eDate.toISOString().split('T')[0];
    
    const sStr = sDate.toISOString().split('T')[0];
    const eStr = eDate.toISOString().split('T')[0];
    document.getElementById('dashboard-title').textContent = `Dashboard MW - ${paket}`;
    document.getElementById('week-info').textContent = `Periode: ${sStr} s/d ${eStr} (Week ${getWeekNumber(eDate)})`;
    
    if (paket === 'Main') {
        renderMainDashboard(sDate, eDate);
    } else {
        renderRegionDashboard(paket, regions, sDate, eDate);
    }
}

function closeDashboard() {
    document.getElementById('mynetwork').style.display = 'block';
    document.getElementById('dashboard-overlay').style.display = 'none';
    destroyDashCharts();
}

function destroyDashCharts() {
    dashCharts.forEach(c => c.destroy());
    dashCharts = [];
}

function renderMainDashboard(sDate, eDate) {
    const content = document.getElementById('dashboard-content');
    let totalPoi = Object.keys(poiToNodes).length;
    let totalLinks = 0;
    let rslCat = { 'Optimal': 0, 'Minor': 0, 'Observes': 0, 'Action TS': 0 };
    let totalCapDesign = 0, totalCapActual = 0, sumUtil = 0, utilCount = 0;
    
    const uniqueLinks = new Set();
    Object.keys(linkToIp).forEach(link => {
        const p = link.split('-');
        uniqueLinks.add(p[0] < p[1] ? `${p[0]}-${p[1]}` : `${p[1]}-${p[0]}`);
    });
    totalLinks = uniqueLinks.size;
    
    uniqueLinks.forEach(linkId => {
        const perf = performanceData[linkId] || performanceData[`${linkId.split('-')[1]}-${linkId.split('-')[0]}`];
        if (perf) {
            const filtered = perf.filter(d => {
                if(!d.date) return false;
                const dDate = new Date(d.date);
                return dDate >= sDate && dDate <= eDate;
            });
            if (filtered.length > 0) {
                const validRsl = filtered.filter(d => !isNaN(d.rsl)).map(d => d.rsl);
                if (validRsl.length > 0) {
                    const maxRsl = Math.max(...validRsl);
                    if (maxRsl >= -3) rslCat['Optimal']++;
                    else if (maxRsl >= -6) rslCat['Minor']++;
                    else if (maxRsl >= -10) rslCat['Observes']++;
                    else rslCat['Action TS']++;
                }
                const validCap = filtered.filter(d => !isNaN(d.cap)).map(d => d.cap);
                if (validCap.length > 0) totalCapActual += Math.max(...validCap);
                const validUtil = filtered.filter(d => !isNaN(d.util)).map(d => d.util);
                if (validUtil.length > 0) { sumUtil += Math.max(...validUtil); utilCount++; }
            }
            const capDesignRec = perf.find(d => !isNaN(d.capDesign));
            if (capDesignRec) totalCapDesign += capDesignRec.capDesign;
        }
    });
    const avgUtil = utilCount > 0 ? sumUtil / utilCount : 0;

    content.innerHTML += `
        <div class="dash-card">
            <h3>Summary Total</h3>
            <div class="dash-stat-row">
                <div class="dash-stat-item"><div class="val">${totalPoi}</div><div class="lbl">Total POI</div></div>
                <div class="dash-stat-item"><div class="val">${totalLinks}</div><div class="lbl">Total Link</div></div>
            </div>
        </div>`;
    
    content.innerHTML += `
        <div class="dash-card">
            <h3>Total Performance RSL</h3>
            <div class="dash-chart-container"><canvas id="dashRslChart"></canvas></div>
        </div>`;
    dashCharts.push(new Chart(document.getElementById('dashRslChart').getContext('2d'), {
        type: 'doughnut',
        data: { labels: Object.keys(rslCat), datasets: [{ data: Object.values(rslCat), backgroundColor: ['#27ae60', '#00bcd4', '#f1c40f', '#e74c3c'] }] },
        options: { plugins: { datalabels: { color: '#fff', font: { weight: 'bold' }, formatter: (v) => v > 0 ? v : '' } }, legend: { position: 'bottom' } } }
    }));

    content.innerHTML += `
        <div class="dash-card">
            <h3>Capacity Design vs Actual & Utilization</h3>
            <div class="dash-chart-container"><canvas id="dashCapChart"></canvas></div>
        </div>`;
    dashCharts.push(new Chart(document.getElementById('dashCapChart').getContext('2d'), {
        type: 'bar',
        data: { labels: ['Total'], datasets: [
            { label: 'Cap Design (Mbps)', data: [totalCapDesign], backgroundColor: '#3498db', yAxisID: 'y' },
            { label: 'Cap Actual (Mbps)', data: [totalCapActual], backgroundColor: '#27ae60', yAxisID: 'y' },
            { label: 'Utilization (%)', data: [avgUtil], type: 'line', borderColor: '#e74c3c', backgroundColor: '#e74c3c', yAxisID: 'y1', tension: 0.1 }
        ]},
        options: { scales: { y: { position: 'left', title: { display: true, text: 'Mbps' } }, y1: { position: 'right', title: { display: true, text: '%' }, grid: { drawOnChartArea: false }, min: 0, max: 100 } }, plugins: { datalabels: { anchor: 'end', align: 'top', font: { size: 10 } } } }
    }));
}

function renderRegionDashboard(paket, regions, sDate, eDate) {
    const content = document.getElementById('dashboard-content');
    let totalPoi = 0, totalLinks = 0;
    let poiData = {};
    
    regions.forEach(r => {
        if (regionMap[r]) {
            totalPoi += regionMap[r].size;
            regionMap[r].forEach(p => { poiData[p] = { maxUtil: [], aveUtil: [], capDesign: 0, capActual: 0 }; });
        }
    });
    
    const uniqueLinks = new Set();
    Object.keys(linkToIp).forEach(link => {
        const p = link.split('-');
        uniqueLinks.add(p[0] < p[1] ? `${p[0]}-${p[1]}` : `${p[1]}-${p[0]}`);
    });
    
    uniqueLinks.forEach(linkId => {
        const [id1, id2] = linkId.split('-');
        const poi1 = nodeToPoi[id1], poi2 = nodeToPoi[id2];
        const reg1 = nodeData[id1] ? nodeData[id1].region : null;
        const reg2 = nodeData[id2] ? nodeData[id2].region : null;
        
        if (regions.includes(reg1) || regions.includes(reg2)) {
            totalLinks++;
            const perf = performanceData[linkId] || performanceData[`${id2}-${id1}`];
            if (perf) {
                const filtered = perf.filter(d => {
                    if(!d.date) return false;
                    const dDate = new Date(d.date);
                    return dDate >= sDate && dDate <= eDate;
                });
                let linkMaxUtil = NaN, linkAveUtil = NaN, linkCapDesign = NaN, linkCapActual = NaN;
                if (filtered.length > 0) {
                    const validUtil = filtered.filter(d => !isNaN(d.util)).map(d => d.util);
                    if (validUtil.length > 0) {
                        linkMaxUtil = Math.max(...validUtil);
                        linkAveUtil = validUtil.reduce((a,b) => a+b, 0) / validUtil.length;
                    }
                    const validCap = filtered.filter(d => !isNaN(d.cap)).map(d => d.cap);
                    if (validCap.length > 0) linkCapActual = Math.max(...validCap);
                }
                const capDesignRec = perf.find(d => !isNaN(d.capDesign));
                if (capDesignRec) linkCapDesign = capDesignRec.capDesign;
                
                [poi1, poi2].forEach(p => {
                    if (poiData[p]) {
                        if (!isNaN(linkMaxUtil)) poiData[p].maxUtil.push(linkMaxUtil);
                        if (!isNaN(linkAveUtil)) poiData[p].aveUtil.push(linkAveUtil);
                        if (!isNaN(linkCapDesign)) poiData[p].capDesign += linkCapDesign;
                        if (!isNaN(linkCapActual)) poiData[p].capActual += linkCapActual;
                    }
                });
            }
        }
    });
    
    const poiNames = Object.keys(poiData);
    const maxUtilData = poiNames.map(p => poiData[p].maxUtil.length ? Math.max(...poiData[p].maxUtil) : 0);
    const aveUtilData = poiNames.map(p => poiData[p].aveUtil.length ? (poiData[p].aveUtil.reduce((a,b)=>a+b,0)/poiData[p].aveUtil.length) : 0);
    const capDesData = poiNames.map(p => poiData[p].capDesign);
    const capActData = poiNames.map(p => poiData[p].capActual);

    content.innerHTML += `
        <div class="dash-card">
            <h3>Summary ${paket}</h3>
            <div class="dash-stat-row">
                <div class="dash-stat-item"><div class="val">${totalPoi}</div><div class="lbl">Total POI</div></div>
                <div class="dash-stat-item"><div class="val">${totalLinks}</div><div class="lbl">Total Link</div></div>
            </div>
        </div>`;
    
    content.innerHTML += `
        <div class="dash-card">
            <h3>Total Utilization Capacity Usage (%)</h3>
            <div class="dash-chart-container"><canvas id="dashUtilChart"></canvas></div>
        </div>`;
    dashCharts.push(new Chart(document.getElementById('dashUtilChart').getContext('2d'), {
        type: 'bar',
        data: { labels: poiNames, datasets: [
            { label: 'Max Util (%)', data: maxUtilData, backgroundColor: '#3498db' },
            { label: 'Ave Util (%)', data: aveUtilData, backgroundColor: '#95a5a6' }
        ]},
        options: { scales: { y: { min: 0, max: 100 } }, plugins: { datalabels: { anchor: 'end', align: 'top', font: { size: 9 }, formatter: (v) => v > 0 ? v.toFixed(1)+'%' : '' } }, legend: { position: 'bottom' } } }
    }));

    content.innerHTML += `
        <div class="dash-card">
            <h3>Total Capacity Design vs Usage Capacity</h3>
            <div class="dash-chart-container"><canvas id="dashCapSumChart"></canvas></div>
        </div>`;
    dashCharts.push(new Chart(document.getElementById('dashCapSumChart').getContext('2d'), {
        type: 'bar',
        data: { labels: poiNames, datasets: [
            { label: 'Cap Design (Mbps)', data: capDesData, backgroundColor: '#3498db' },
            { label: 'Cap Actual (Mbps)', data: capActData, backgroundColor: '#27ae60' }
        ]},
        options: { plugins: { datalabels: { anchor: 'end', align: 'top', font: { size: 9 }, formatter: (v) => v > 0 ? v.toFixed(0) : '' } }, legend: { position: 'bottom' } } }
    }));
}

// TAMBAHAN: Gambar Equipment IDU NEC & IP-20 per Region
// ============================================================
(function() {
    var EQUIP_IMAGES = {
        IDU_NEC: 'https://z-cdn-media.chatglm.cn/files/31180886-2fe3-467e-b51d-6df88a462e14.png?auth_key=1882875811-76b5d593d9234b0280c91b17cda1f2d0-0-6e460c28a36674fa4457ffc8c4205dd3',
        IP_20: 'https://z-cdn-media.chatglm.cn/files/95f4949f-0e78-41f4-96d8-a2a50486059b.png?auth_key=1882875811-9be3c28307c046108593b8855e2e854d-0-aab92349262f56ea5cd245af44c59102'
    };
    var IDU_NEC_REGIONS = ['Sulawesi', 'Natuna'];
    var IP20_REGIONS = ['Kalimantan', 'Sumatera', 'NTT', 'Maluku'];
    var nodeRegionMap = {};
    rawData.trim().split('\n').forEach(function(line) {
        var parts = line.trim().split(/\s+/);
        if (parts.length >= 3) {
            var link = parts[0]; 
            var region = parts[2];
            var dashIdx = link.indexOf('-');
            if (dashIdx !== -1) {
                var node1 = link.substring(0, dashIdx);
                var node2 = link.substring(dashIdx + 1);
                if (!nodeRegionMap[node1]) nodeRegionMap[node1] = region;
                if (!nodeRegionMap[node2]) nodeRegionMap[node2] = region;
            }
        }
    });
    function getNodeFromTitle(titleText) {
        if (!titleText) return null;
        var keys = Object.keys(nodeRegionMap).sort(function(a, b) { return b.length - a.length; });
        for (var i = 0; i < keys.length; i++) {
            if (titleText.indexOf(keys[i]) !== -1) return keys[i];
        }
        return null;
    }
    function injectEquipmentImage() {
        var panel = document.getElementById('detail-panel');
        if (!panel.classList.contains('active')) return;
        var titleText = document.getElementById('detail-title').textContent;
        var nodeId = getNodeFromTitle(titleText);
        if (!nodeId) return;
        var summaryContainer = document.getElementById('summary-container');
        var existingImg = document.getElementById('equip-image-container');
        if (existingImg) existingImg.remove();
        var region = nodeRegionMap[nodeId];
        if (!region) return;
        var imageUrl = null;
        var imageLabel = '';
        if (IDU_NEC_REGIONS.indexOf(region) !== -1) {
            imageUrl = EQUIP_IMAGES.IDU_NEC;
            imageLabel = 'IDU NEC';
        } else if (IP20_REGIONS.indexOf(region) !== -1) {
            imageUrl = EQUIP_IMAGES.IP_20;
            imageLabel = 'IP-20S/C';
        }
        if (imageUrl) {
            var imgContainer = document.createElement('div');
            imgContainer.id = 'equip-image-container';
            imgContainer.innerHTML =
                '<div class="equip-label">Equipment: ' + imageLabel + ' (' + region + ')</div>' +
                '<img src="' + imageUrl + '" alt="' + imageLabel + '">';
            summaryContainer.parentNode.insertBefore(imgContainer, summaryContainer);
        }
    }
    function removeEquipmentImage() {
        var existingImg = document.getElementById('equip-image-container');
        if (existingImg) existingImg.remove();
    }
    var detailPanelEl = document.getElementById('detail-panel');
    var panelClassObserver = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            if (mutation.attributeName === 'class') {
                if (detailPanelEl.classList.contains('active')) {
                    setTimeout(injectEquipmentImage, 80);
                } else {
                    removeEquipmentImage();
                }
            }
        });
    });
    panelClassObserver.observe(detailPanelEl, { attributes: true, attributeFilter: ['class'] });
    var titleEl = document.getElementById('detail-title');
    var titleObserver = new MutationObserver(function() {
        if (detailPanelEl.classList.contains('active')) {
            injectEquipmentImage();
        }
    });
    titleObserver.observe(titleEl, { childList: true, characterData: true, subtree: true });
})();

(function() {
    async function loadFromGoogleSheets() {
        const statusEl = document.getElementById('fetch-status');
        const sheetId = '19cFmUtA_BP16Cgck4-25avMAyxlMuDJQrxITgEDE7jQ';
        const gid = '720718926';
        const googleSheetExportUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=xlsx&gid=${gid}`;
        
        try {
            if(statusEl) statusEl.innerHTML = '⏳ Memuat data otomatis dari Google Sheets...';
            const response = await fetch(googleSheetExportUrl);
            if (!response.ok) throw new Error('HTTP error ' + response.status);
            
            const blob = await response.blob();
            // Cek apakah response adalah HTML (biasanya halaman login Google jika akses ditolak)
            if (blob.type.includes('text/html')) {
                throw new Error('Akses ditolak (Halaman Login)');
            }
            
            const fileName = "Data Performa Google Sheets.xlsx";
            const file = new File([blob], fileName, { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
            
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            const fileInput = document.getElementById('fileInput');
            fileInput.files = dataTransfer.files;
            
            const event = new Event('change', { bubbles: true });
            fileInput.dispatchEvent(event);
            
        } catch (error) {
            console.error('Error loading Google Sheets data:', error);
            if(statusEl) statusEl.innerHTML = '⚠️ <span style="color:#e74c3c;">Gagal otomatis. Silakan upload manual.</span>';
        }
    }
    window.addEventListener('load', loadFromGoogleSheets);
})();
